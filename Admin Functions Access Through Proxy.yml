title: Admin Functions Access Through Proxy
description: |
  Detects when a proxy is used while executing admin actions in Okta.
references:
  - 
threat:
  Tactic:
    - TA0006: Credential_access
  Technique:
    - T1552: Unsecured Credentials
prevention:
  Mitigation:
    - M1027: Password Policies
  D3fend:
    - D3-UBA (User Behavior Analysis)
detection:
  sumologic_log_search: |
    (_source=Okta or _source="Okta Preview")

    // Extract core fields
    | json field=_raw "eventType" as eventType 
    | json field=_raw "debugContext.debugData.requestUri" as URI | where URI CONTAINS "admin" 
    | json field=_raw "securityContext.isProxy" as proxy | where proxy = "true"
    | json field=_raw "actor.alternateId" as actor_ID
    | json field=_raw "actor.displayName" as actor_displayName
    | json field=_raw "outcome.result" as outcomeResult 
    | formatDate(_messageTime, "MM/dd/yyyy HH:mm zzz") as timestamp

    // Output summary
    | count by timestamp, actor_ID, actor_displayName, eventType, URI, proxy, _source, outcomeResult
    | sort by timestamp desc

  okta_systemlog_query: |
    debugContext.debugData.requestUri eq "admin" and securityContext.isProxy eq "true"
false_positives:
  - A VPN may appear as a proxy.
