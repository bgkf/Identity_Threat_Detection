title: MFA Reset All
description: |
  Detects when all of a users MFA factors are reset.
references:
  - 
threat:
  Tactic:
    - TA0003: Persistence
  Technique:
    - T1556: Modify Authentication Process
    - T1556.006: Multi-Factor Authentication
    - T1098: Account Manipulation
prevention:
  Mitigation:
    - M1032: Multi-Factor Authentication (MFA)
    - M1027: Password Policies
    - M1018: User Account Management
  D3fend:
    - D3-AA (Agent Authentication)
    - D3-CH (Credential Hardening)
detection:
  sumologic_log_search: |
    (_source=Okta or _source="Okta Preview")

    // Extract core fields
    | json field=_raw "eventType" as eventType | where %"eventType" = "user.mfa.factor.reset_all"
    | json field=_raw "actor.alternateId" as actor_ID
    | json field=_raw "actor.displayName" as actor_displayName
    | json field=_raw "outcome.result" as outcomeResult
    | formatDate(_messageTime, "MM/dd/yyyy HH:mm zzz") as timestamp

    // Output summary
    | count by timestamp, actor_ID, actor_displayName, eventType, _source, outcomeResult 
    | sort by timestamp desc

  okta_systemlog_query: |
    eventType eq "user.mfa.factor.reset_all”
false_positives:
  - 
