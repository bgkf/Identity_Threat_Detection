title: Admin Role Assignment Created
description: |
  Detects when a new admin role assignment is created.
references:
  - 
threat:
  Tactic:
    - TA0004: Privilege Escalation
  Technique:
    - T1078: Valid Accounts
    - T1098: Account Manipulation
prevention:
  D3fend:
    - 
detection:
  sumologic_log_search: |
    (_source=Okta or _source="Okta Preview")

    // Extract core fields
    | json field=_raw "eventType" as eventType | where %"eventType" = "iam.resourceset.bindings.add"
    | json field=_raw "actor.alternateId" as actor_ID
    | json field=_raw "actor.displayName" as actor_displayName
    | json field=_raw "target[0].displayName" as resourceSet
    | json field=_raw "target[1].displayName" as role
    | json field=_raw "target[2].displayName" as user
    | json field=_raw "outcome.result" as outcomeResult
    | formatDate(_messageTime, "MM/dd/yyyy HH:mm zzz") as timestamp

    // Output summary
    | count by timestamp, actor_ID, actor_displayName, eventType, resourceSet, role, user, _source, outcomeResult
    | sort by timestamp desc

  okta_systemlog_query: |
    eventType eq "iam.resourceset.bindings.add"
false_positives:
  - Legitimate creation of a new admin role assignment.
