title: Threat Insight Attack Detected
description: |
  Okta ThreatInsight aggregates data about sign-in activity across the Okta customer base to analyze and detect potentially malicious IP addresses and to prevent credential-based attacks such as:
	  - password spraying
	  - credential stuffing
	  - brute-force cryptographic attacks
references:
  - https://help.okta.com/oie/en-us/content/topics/security/threat-insight/about-threatinsight.htm
threat:
  Tactic:
    - TA0001: Initial Access
    - TA0006: Credential Acces
  Technique:
    - T1110: Brute Force
    - T1078: Valid Accounts
prevention:
  Mitigation:
    - M1032: Multi-Factor Authentication (MFA)
    - M1027: Password Policies
    - M1018: User Account Management
  D3fend:
    - D3-AA (Agent Authentication)
    - D3-CH (Credential Hardening)
    - D3-UBA (User Behavior Analysis)
detection:
  sumologic_log_search: |
    (_source=Okta or _source="Okta Preview")

    // Extract core fields
    | json field=_raw "eventType" as eventType | where ((%"eventType" = "security.attack.start") or (%"eventType" = "security.attack.end")
    | json field=_raw "actor.alternateId" as actor_ID
    | json field=_raw "actor.displayName" as actor_displayName
    | json field=_raw "device.os_platform" as OS
    | json field=_raw "outcome.result" as outcomeResult
    | formatDate(_messageTime, "MM/dd/yyyy HH:mm zzz") as timestamp

    // Output summary
    | count by timestamp, actor_ID, actor_displayName, eventType, _source, outcomeResult
    | sort by timestamp desc

  okta_systemlog_query: |
    eventType eq "security.attack.start"
    eventType eq "security.attack.end"
false_positives:
  - 
