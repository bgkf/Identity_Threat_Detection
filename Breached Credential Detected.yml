title: Breached Credential Detected
description: |
  Okta monitors third-party lists of public data breaches for username-password combinations in your org. If a user's credentials appear in a list, Okta expires the password according to the password policy configuration and ends all of their related Okta sessions.
references:
  - https://help.okta.com/oie/en-us/content/topics/security/breached-password-protection/about-breached-password-protection.htm
threat:
  Tactic:
    - TA0001: Initial Access
  Technique:
    - T1110: Brute Force
    - T1078: Valid Accounts
prevention:
  Mitigation:
    - M1018: User Account Management
    - M1027: Password Policies
  D3fend:
    - D3-AA (Agent Authentication)
    - D3-CH (Credential Hardening)
detection:
  sumologic_log_search: |
    (_source=Okta or _source="Okta Preview")

    // Extract core fields
    | json field=_raw "eventType" as eventType | where eventType = "security.breached_credential.detected" 
    | json field=_raw "actor.alternateId" as actor_ID
    | json field=_raw "actor.displayName" as actor_displayName
    | json field=_raw "outcome.result" as outcomeResult
    | formatDate(_messageTime, "MM/dd/yyyy HH:mm zzz") as timestamp

    // Output summary
    | count by timestamp, actor_ID, actor_displayName, eventType, _source, outcomeResult 
    | sort by timestamp desc

  okta_systemlog_query: |
    eventType eq "security.breached_credential.detected"
false_positives:
  - 
